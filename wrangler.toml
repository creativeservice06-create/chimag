name = "chimag"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Fișierele statice (CSS, JS, imagini) din /public
[assets]
directory = "./public"
binding = "ASSETS"

# Baza de date (Cloudflare D1)
# Pasul 1 din README: `npx wrangler d1 create chimag-db` și pune aici database_id-ul primit
[[d1_databases]]
binding = "DB"
database_name = "chimag-db"
database_id = "d5b9fdac-398c-4dbb-b076-ab75d71168b7"
migrations_dir = "migrations"

# Pozele produselor: deocamdată în public/img (gratuit, fără R2).
# Pentru încărcare directă din panou, creează bucket-ul R2 "chimag-media" și decomentează:
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "chimag-media"

# Emailuri (formular de contact + notificare la comandă nouă) prin Cloudflare Email Routing.
# Se activează DUPĂ ce chimag.ro e pe Cloudflare și ai pornit Email Routing (vezi README → „Emailuri"):
# scoate „# " din fața celor 3 rânduri de mai jos.
# [[send_email]]
# name = "EMAIL"
# destination_address = "chirilasadrian@yahoo.com"

[vars]
# Adresa magazinului (folosită în emailuri, linkuri și poze). Când cumperi domeniul, schimbi în "https://www.chimag.ro".
SITE_URL = "https://chimag.creativeservice06.workers.dev"
MAIL_FROM = "formular@chimag.ro"

# La fiecare 30 de minute: actualizează statusul livrărilor (tracking AWB)
[triggers]
crons = ["*/30 * * * *"]

[observability]
enabled = true
